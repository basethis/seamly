<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>脉映 · 技术支持</title><style>body{margin:0;background:#faf9f6;color:#222;font:16px/1.75 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:36px 22px 70px}header{background:#fff;border-radius:22px;padding:28px;border-top:5px solid #fa4545}h1{margin:0}h2{font-size:20px;margin:30px 0 5px}p{margin:7px 0}a{color:#c92932}</style></head><body><main><header><h1>脉映 · 技术支持</h1><p>摄像头心率估算与疲劳观察</p></header><h2>使用帮助</h2><p>指尖测量：用食指轻轻覆盖后置主摄像头与闪光灯，保持稳定。面部心率及疲劳观察：在均匀光线下让完整面部进入前置摄像头画面。没有足够有效信号时显示“--”，不会生成模拟数据。</p><h2>权限</h2><p>如拒绝了摄像头或健康数据权限，请在 iPhone“设置”或“健康”中重新授权。健康数据授权为可选项。</p><h2>反馈与说明</h2><p>如需帮助，请发送邮件至 <a href="mailto:bigtiger.wang@outlook.com">bigtiger.wang@outlook.com</a>。请说明机型、iOS 版本和问题经过，勿发送不必要的个人健康数据。脉映仅供一般健康参考，不是医疗诊断工具。</p><p><a href="privacy.html">阅读隐私政策</a></p></main></body></html>
